<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Website Example</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .card {
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>My Static Portfolio</h1>
    <p>
      Welcome to my static website! The content here never changes unless I
      manually edit the HTML file.
    </p>

    <!-- Hardcoded data. It is static and doesn't change without a new deployment. -->
    <div class="card">
      <h3>Project 1: Personal Blog</h3>
      <p>A simple blog written in HTML and CSS.</p>
    </div>

    <div class="card">
      <h3>Project 2: Landing Page</h3>
      <p>A static landing page for a local business.</p>
    </div>

    <script>
      // No JavaScript is really needed to display this content.
      console.log(
        'This is a static website. Data is hardcoded in the HTML structure.',
      )
    </script>
  </body>
</html>
